<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tower of Hanoi - Interactive Canvas Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none; /* Prevent scrolling during canvas drag on mobile */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            touch-action: none;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-3 md:p-6 overflow-x-hidden">

    <!-- Header -->
    <header class="w-full max-w-5xl flex flex-col sm:flex-row justify-between items-center gap-4 mb-3">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
                <i class="fa-solid font-bold text-white text-xl fa-layer-group"></i>
            </div>
            <div>
                <h1 class="text-2xl font-extrabold tracking-tight gradient-text">TOWER OF HANOI</h1>
                <p class="text-xs text-slate-400 font-medium">드래그 앤 드롭 퍼즐 게이밍 하노이의 탑</p>
            </div>
        </div>

        <!-- Disk Level Selector -->
        <div class="flex items-center gap-2 bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 shadow-inner">
            <span class="text-xs font-semibold text-slate-400 px-2">원판 수:</span>
            <div id="disk-buttons" class="flex gap-1">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </header>

    <!-- Status Dashboard -->
    <div class="w-full max-w-5xl grid grid-cols-2 sm:grid-cols-4 gap-3 mb-3">
        <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
            <span class="text-xs font-medium text-slate-400 mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-arrows-rotate text-purple-400"></i> 이동 횟수
            </span>
            <div class="text-xl sm:text-2xl font-bold font-mono text-white">
                <span id="move-count" class="text-purple-400">0</span>
                <span class="text-xs font-normal text-slate-500">/ <span id="min-moves">7</span> (최적)</span>
            </div>
        </div>

        <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
            <span class="text-xs font-medium text-slate-400 mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-clock text-cyan-400"></i> 경과 시간
            </span>
            <div id="timer-display" class="text-xl sm:text-2xl font-bold font-mono text-cyan-400">00:00</div>
        </div>

        <div class="glass-panel p-3 rounded-2xl flex flex-col items-center justify-center text-center">
            <span class="text-xs font-medium text-slate-400 mb-1 flex items-center gap-1.5">
                <i class="fa-solid fa-chart-line text-emerald-400"></i> 이동 효율
            </span>
            <div id="efficiency-display" class="text-xl sm:text-2xl font-bold font-mono text-emerald-400">100%</div>
        </div>

        <div class="glass-panel p-3 rounded-2xl flex items-center justify-around">
            <button id="sound-btn" title="사운드 토글" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center justify-center">
                <i id="sound-icon" class="fa-solid fa-volume-high text-lg"></i>
            </button>
            <button id="undo-btn" title="실행 취소" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center justify-center disabled:opacity-40 disabled:cursor-not-allowed">
                <i class="fa-solid fa-rotate-left text-lg"></i>
            </button>
            <button id="restart-btn" title="재시작" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white transition flex items-center justify-center">
                <i class="fa-solid fa-arrow-rotate-right text-lg"></i>
            </button>
        </div>
    </div>

    <!-- Canvas Area -->
    <main class="w-full max-w-5xl flex-1 flex flex-col items-center justify-center relative my-1">
        <div id="canvas-container" class="w-full relative rounded-3xl overflow-hidden glass-panel border border-slate-700/60 shadow-2xl shadow-purple-950/30 flex items-center justify-center" style="min-height: 360px; max-height: 520px; aspect-ratio: 16/9;">
            <canvas id="gameCanvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
            
            <!-- Toast / Hint Overlay -->
            <div id="hint-overlay" class="absolute top-4 left-1/2 -translate-x-1/2 px-4 py-2 rounded-full bg-slate-900/90 border border-slate-700/80 text-xs text-slate-300 pointer-events-none transition-opacity opacity-100 flex items-center gap-2 shadow-xl backdrop-blur-md">
                <i class="fa-solid fa-hand-pointer text-purple-400"></i>
                <span>맨 위의 원판을 마우스나 손가락으로 드래그하여 이동하세요.</span>
            </div>

            <!-- Auto-Solve Indicator Overlay -->
            <div id="autosolve-banner" class="hidden absolute bottom-4 left-1/2 -translate-x-1/2 px-5 py-2.5 rounded-2xl bg-purple-950/90 border border-purple-500/50 text-xs font-semibold text-purple-200 pointer-events-none flex items-center gap-3 shadow-2xl backdrop-blur-md animate-pulse">
                <i class="fa-solid fa-robot text-purple-400 text-base"></i>
                <span>알고리즘 자동 풀이가 진행 중입니다...</span>
            </div>
        </div>

        <!-- Controls & Auto-Solve Panel -->
        <div class="w-full flex flex-wrap items-center justify-between gap-3 mt-3">
            <div class="flex items-center gap-2">
                <button id="auto-solve-btn" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-semibold text-xs sm:text-sm shadow-lg shadow-purple-600/25 transition flex items-center gap-2 active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>자동 풀이 (Auto Solve)</span>
                </button>
                <div class="flex items-center gap-2 bg-slate-900/80 px-3 py-1.5 rounded-xl border border-slate-800 text-xs text-slate-400">
                    <span>속도:</span>
                    <input id="solve-speed" type="range" min="1" max="5" value="3" class="w-20 accent-purple-500 cursor-pointer">
                </div>
            </div>

            <div class="text-xs text-slate-400 flex items-center gap-4">
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-indigo-500 inline-block"></span> 기둥 A (출발)</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-cyan-500 inline-block"></span> 기둥 B (경유)</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> 기둥 C (목적지)</span>
            </div>
        </div>
    </main>

    <!-- Victory Modal -->
    <div id="win-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel border border-slate-700 bg-slate-900/90 rounded-3xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl transform scale-90 transition-all duration-300" id="win-card">
            <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-400 to-emerald-400 flex items-center justify-center mx-auto mb-4 shadow-xl shadow-emerald-500/20 animate-bounce">
                <i class="fa-solid fa-trophy text-slate-950 text-4xl"></i>
            </div>
            
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">축하합니다! 스테이지 클리어!</h2>
            <p id="win-subtitle" class="text-xs text-slate-400 mb-6">모든 원판을 성공적으로 목적지 기둥으로 이동했습니다.</p>

            <div class="grid grid-cols-3 gap-2 bg-slate-950/60 p-3 rounded-2xl border border-slate-800 mb-6 text-center">
                <div>
                    <div class="text-xs text-slate-500 mb-0.5">이동 횟수</div>
                    <div id="modal-moves" class="text-lg font-bold font-mono text-purple-400">0</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500 mb-0.5">최적 횟수</div>
                    <div id="modal-min-moves" class="text-lg font-bold font-mono text-slate-300">7</div>
                </div>
                <div>
                    <div class="text-xs text-slate-500 mb-0.5">달성 시간</div>
                    <div id="modal-time" class="text-lg font-bold font-mono text-cyan-400">00:00</div>
                </div>
            </div>

            <div class="flex gap-3">
                <button id="modal-replay-btn" class="flex-1 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-sm transition active:scale-95">
                    다시 하기
                </button>
                <button id="modal-next-btn" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-purple-600 to-cyan-500 hover:from-purple-500 hover:to-cyan-400 text-white font-semibold text-sm shadow-lg shadow-purple-500/25 transition active:scale-95 flex items-center justify-center gap-1.5">
                    <span>다음 난이도</span>
                    <i class="fa-solid fa-chevron-right text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * Tower of Hanoi Web Audio Sound Effects Synthesizer
         */
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) {
                        this.ctx = new AudioContext();
                    }
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playPickup() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }

            playDrop(diskSize = 3) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const baseFreq = 400 - (diskSize * 35); // Larger disks = lower pitch
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, this.ctx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }

            playError() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.setValueAtTime(110, this.ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.18);
            }

            playWin() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;

                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // C E G C E G
                notes.forEach((freq, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;

                    const startTime = this.ctx.currentTime + (i * 0.09);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            }
        }

        const DISK_COLORS = [
            { start: '#f43f5e', end: '#fb7185' }, // 1: Coral Rose
            { start: '#f97316', end: '#fb923c' }, // 2: Warm Amber
            { start: '#eab308', end: '#fde047' }, // 3: Gold
            { start: '#10b981', end: '#34d399' }, // 4: Emerald
            { start: '#06b6d4', end: '#22d3ee' }, // 5: Cyan
            { start: '#3b82f6', end: '#60a5fa' }, // 6: Royal Blue
            { start: '#8b5cf6', end: '#a78bfa' }  // 7: Vivid Purple
        ];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = Math.random() * -12 - 4;
                this.gravity = 0.35;
                this.size = Math.random() * 8 + 4;
                this.color = `hsl(${Math.random() * 360}, 85%, 65%)`;
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.2;
                this.life = 1.0;
                this.decay = Math.random() * 0.015 + 0.008;
            }

            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.vRot;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        class HanoiGame {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.container = document.getElementById('canvas-container');

                this.audio = new AudioEngine();

                // Game Configuration & State
                this.diskCount = 3;
                this.pegs = [[], [], []]; // Array of disk size IDs (e.g. [3, 2, 1])
                this.pegCoords = [];      // Calculated X coordinates for 3 pegs

                // Drag and Animation state management
                this.isDragging = false;
                this.dragState = null; // { diskId, sourcePeg, targetPeg, x, y, targetX, targetY, isSnapping }

                // Move History for Undo
                this.history = [];
                this.moveCount = 0;

                // Timer State
                this.timerInterval = null;
                this.secondsElapsed = 0;
                this.gameStarted = false;
                this.isGameWon = false;

                // Auto-Solver State
                this.isAutoSolving = false;
                this.solveSteps = [];
                this.solveTimeout = null;

                // Visual Effects
                this.particles = [];

                this.initCanvasSize();
                this.bindEvents();
                this.renderLevelButtons();
                this.resetGame();
                this.startLoop();
            }

            initCanvasSize() {
                const rect = this.container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                
                this.width = rect.width;
                this.height = rect.height;

                this.canvas.width = this.width * dpr;
                this.canvas.height = this.height * dpr;
                this.ctx.scale(dpr, dpr);

                // Re-calculate Peg positions
                this.pegCoords = [
                    this.width * 0.22,
                    this.width * 0.50,
                    this.width * 0.78
                ];

                this.baseY = this.height - 50;
                this.pegHeight = Math.min(220, this.height * 0.55);
                this.pegWidth = 14;
                this.diskHeight = Math.min(26, (this.pegHeight - 20) / 7);
            }

            renderLevelButtons() {
                const container = document.getElementById('disk-buttons');
                container.innerHTML = '';
                for (let i = 3; i <= 7; i++) {
                    const btn = document.createElement('button');
                    btn.className = `w-8 h-8 rounded-lg text-xs font-bold transition-all ${
                        i === this.diskCount
                            ? 'bg-gradient-to-r from-purple-500 to-cyan-500 text-white shadow-md scale-105'
                            : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                    }`;
                    btn.innerText = i;
                    btn.onclick = () => {
                        if (this.isAutoSolving) this.stopAutoSolve();
                        this.diskCount = i;
                        this.renderLevelButtons();
                        this.resetGame();
                    };
                    container.appendChild(btn);
                }
            }

            resetGame() {
                this.stopAutoSolve();
                this.pegs = [[], [], []];
                for (let d = this.diskCount; d >= 1; d--) {
                    this.pegs[0].push(d);
                }

                this.isDragging = false;
                this.dragState = null;
                this.history = [];
                this.moveCount = 0;
                this.isGameWon = false;
                this.particles = [];

                this.resetTimer();
                this.updateUI();
                this.hideWinModal();

                document.getElementById('hint-overlay').classList.remove('opacity-0');
            }

            resetTimer() {
                clearInterval(this.timerInterval);
                this.timerInterval = null;
                this.secondsElapsed = 0;
                this.gameStarted = false;
                this.updateTimerDisplay();
            }

            startTimer() {
                if (this.gameStarted) return;
                this.gameStarted = true;
                this.timerInterval = setInterval(() => {
                    this.secondsElapsed++;
                    this.updateTimerDisplay();
                }, 1000);
            }

            updateTimerDisplay() {
                const mins = Math.floor(this.secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (this.secondsElapsed % 60).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${mins}:${secs}`;
            }

            get minMoves() {
                return Math.pow(2, this.diskCount) - 1;
            }

            updateUI() {
                document.getElementById('move-count').innerText = this.moveCount;
                document.getElementById('min-moves').innerText = this.minMoves;
                document.getElementById('undo-btn').disabled = this.history.length === 0 || this.isAutoSolving;

                let efficiency = 100;
                if (this.moveCount > this.minMoves) {
                    efficiency = Math.max(10, Math.round((this.minMoves / this.moveCount) * 100));
                }
                document.getElementById('efficiency-display').innerText = `${efficiency}%`;
            }

            getDiskWidth(diskId) {
                const minW = 55;
                const maxW = Math.min(this.width * 0.22, 190);
                const step = (maxW - minW) / Math.max(1, this.diskCount - 1);
                return minW + (diskId - 1) * step;
            }

            getDiskPosition(pegIdx, stackPos) {
                const x = this.pegCoords[pegIdx];
                const y = this.baseY - (stackPos + 1) * this.diskHeight;
                return { x, y };
            }

            getPegFromX(x) {
                const threshold = this.width * 0.15;
                for (let i = 0; i < 3; i++) {
                    if (Math.abs(x - this.pegCoords[i]) < threshold) {
                        return i;
                    }
                }
                return -1;
            }

            bindEvents() {
                window.addEventListener('resize', () => this.initCanvasSize());

                // Mouse Event Listeners
                this.canvas.addEventListener('mousedown', (e) => this.handlePointerDown(e));
                window.addEventListener('mousemove', (e) => this.handlePointerMove(e));
                window.addEventListener('mouseup', (e) => this.handlePointerUp(e));

                // Touch Event Listeners
                this.canvas.addEventListener('touchstart', (e) => {
                    if (e.touches.length > 0) this.handlePointerDown(e.touches[0]);
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    if (this.isDragging && e.touches.length > 0) {
                        e.preventDefault();
                        this.handlePointerMove(e.touches[0]);
                    }
                }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    if (this.isDragging) this.handlePointerUp(e);
                });

                // UI Button Listeners
                document.getElementById('restart-btn').onclick = () => this.resetGame();
                document.getElementById('undo-btn').onclick = () => this.undoMove();
                document.getElementById('auto-solve-btn').onclick = () => this.toggleAutoSolve();

                const soundBtn = document.getElementById('sound-btn');
                const soundIcon = document.getElementById('sound-icon');
                soundBtn.onclick = () => {
                    this.audio.enabled = !this.audio.enabled;
                    soundIcon.className = this.audio.enabled ? "fa-solid fa-volume-high text-lg" : "fa-solid fa-volume-xmark text-lg text-rose-400";
                };

                document.getElementById('modal-replay-btn').onclick = () => this.resetGame();
                document.getElementById('modal-next-btn').onclick = () => {
                    if (this.diskCount < 7) {
                        this.diskCount++;
                        this.renderLevelButtons();
                    }
                    this.resetGame();
                };
            }

            getCanvasPos(e) {
                const rect = this.canvas.getBoundingClientRect();
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }

            finishSnapInstantly() {
                if (!this.dragState) return;
                const { diskId, targetPeg } = this.dragState;
                this.pegs[targetPeg].push(diskId);
                this.dragState = null;
                this.checkWinCondition();
            }

            handlePointerDown(e) {
                if (this.isGameWon || this.isAutoSolving) return;

                // Immediately finish previous snap if user quickly clicks next disk
                if (this.dragState && this.dragState.isSnapping) {
                    this.finishSnapInstantly();
                }

                if (this.dragState) return;

                const pos = this.getCanvasPos(e);
                const clickedPeg = this.getPegFromX(pos.x);

                if (clickedPeg !== -1 && this.pegs[clickedPeg].length > 0) {
                    const stack = this.pegs[clickedPeg];
                    const topDiskId = stack[stack.length - 1];
                    const topPos = this.getDiskPosition(clickedPeg, stack.length - 1);

                    const diskW = this.getDiskWidth(topDiskId);
                    const halfW = diskW / 2;

                    if (pos.x >= topPos.x - halfW && pos.x <= topPos.x + halfW &&
                        pos.y >= topPos.y && pos.y <= topPos.y + this.diskHeight) {
                        
                        // Pick up disk from stack
                        this.pegs[clickedPeg].pop();

                        this.isDragging = true;
                        this.dragState = {
                            diskId: topDiskId,
                            sourcePeg: clickedPeg,
                            targetPeg: clickedPeg,
                            x: topPos.x,
                            y: topPos.y - 10,
                            targetX: pos.x,
                            targetY: pos.y - 10,
                            isSnapping: false
                        };

                        this.audio.playPickup();
                        document.getElementById('hint-overlay').classList.add('opacity-0');
                    }
                }
            }

            handlePointerMove(e) {
                // Ignore mouse moves if not dragging or currently snapping
                if (!this.dragState || !this.isDragging || this.dragState.isSnapping) return;
                const pos = this.getCanvasPos(e);
                this.dragState.targetX = pos.x;
                this.dragState.targetY = pos.y - 10;
            }

            handlePointerUp(e) {
                if (!this.dragState || !this.isDragging) return;

                // Stop dragging flag immediately so cursor movement no longer alters target position
                this.isDragging = false;

                const dropPeg = this.getPegFromX(this.dragState.x);
                const sourcePeg = this.dragState.sourcePeg;
                const diskId = this.dragState.diskId;

                let isValidMove = false;
                let targetPeg = sourcePeg;

                if (dropPeg !== -1) {
                    const targetStack = this.pegs[dropPeg];
                    if (targetStack.length === 0 || targetStack[targetStack.length - 1] > diskId) {
                        isValidMove = true;
                        targetPeg = dropPeg;
                    }
                }

                if (isValidMove) {
                    this.startTimer();

                    if (targetPeg !== sourcePeg) {
                        this.history.push({ from: sourcePeg, to: targetPeg, diskId: diskId });
                        this.moveCount++;
                        this.updateUI();
                        this.audio.playDrop(diskId);
                    }

                    const targetStackPos = this.pegs[targetPeg].length;
                    const finalPos = this.getDiskPosition(targetPeg, targetStackPos);

                    this.dragState.isSnapping = true;
                    this.dragState.targetPeg = targetPeg;
                    this.dragState.targetX = finalPos.x;
                    this.dragState.targetY = finalPos.y;

                } else {
                    // Invalid Move: Return to source peg
                    this.audio.playError();

                    const targetStackPos = this.pegs[sourcePeg].length;
                    const finalPos = this.getDiskPosition(sourcePeg, targetStackPos);

                    this.dragState.isSnapping = true;
                    this.dragState.targetPeg = sourcePeg;
                    this.dragState.targetX = finalPos.x;
                    this.dragState.targetY = finalPos.y;
                }
            }

            undoMove() {
                if (this.history.length === 0 || this.isAutoSolving || this.isGameWon || this.isDragging || (this.dragState && this.dragState.isSnapping)) return;

                const lastMove = this.history.pop();
                const diskId = this.pegs[lastMove.to].pop();
                this.pegs[lastMove.from].push(diskId);
                
                this.moveCount = Math.max(0, this.moveCount - 1);
                this.audio.playPickup();
                this.updateUI();
            }

            checkWinCondition() {
                if (this.pegs[2].length === this.diskCount) {
                    this.isGameWon = true;
                    clearInterval(this.timerInterval);
                    this.audio.playWin();
                    this.spawnConfetti();
                    
                    setTimeout(() => {
                        this.showWinModal();
                    }, 600);
                }
            }

            spawnConfetti() {
                for (let i = 0; i < 90; i++) {
                    this.particles.push(new Particle(this.width / 2, this.height / 2));
                }
            }

            showWinModal() {
                const modal = document.getElementById('win-modal');
                const card = document.getElementById('win-card');
                
                document.getElementById('modal-moves').innerText = this.moveCount;
                document.getElementById('modal-min-moves').innerText = this.minMoves;
                document.getElementById('modal-time').innerText = document.getElementById('timer-display').innerText;

                modal.classList.remove('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-90');
                card.classList.add('scale-100');
            }

            hideWinModal() {
                const modal = document.getElementById('win-modal');
                const card = document.getElementById('win-card');

                modal.classList.add('opacity-0', 'pointer-events-none');
                card.classList.remove('scale-100');
                card.classList.add('scale-90');
            }

            toggleAutoSolve() {
                if (this.isAutoSolving) {
                    this.stopAutoSolve();
                } else {
                    this.startAutoSolve();
                }
            }

            startAutoSolve() {
                this.resetGame();
                this.isAutoSolving = true;
                
                document.getElementById('auto-solve-btn').classList.add('ring-2', 'ring-purple-400', 'from-amber-600', 'to-rose-600');
                document.getElementById('auto-solve-btn').querySelector('span').innerText = "정지 (Stop)";
                document.getElementById('autosolve-banner').classList.remove('hidden');

                this.solveSteps = [];
                this.generateHanoiSteps(this.diskCount, 0, 2, 1);

                this.executeNextSolveStep();
            }

            stopAutoSolve() {
                this.isAutoSolving = false;
                clearTimeout(this.solveTimeout);
                
                const btn = document.getElementById('auto-solve-btn');
                btn.classList.remove('ring-2', 'ring-purple-400', 'from-amber-600', 'to-rose-600');
                btn.querySelector('span').innerText = "자동 풀이 (Auto Solve)";
                document.getElementById('autosolve-banner').classList.add('hidden');
                this.updateUI();
            }

            generateHanoiSteps(n, source, target, auxiliary) {
                if (n === 1) {
                    this.solveSteps.push({ from: source, to: target });
                    return;
                }
                this.generateHanoiSteps(n - 1, source, auxiliary, target);
                this.solveSteps.push({ from: source, to: target });
                this.generateHanoiSteps(n - 1, auxiliary, target, source);
            }

            executeNextSolveStep() {
                if (!this.isAutoSolving || this.solveSteps.length === 0) {
                    if (this.solveSteps.length === 0 && this.isAutoSolving) {
                        this.stopAutoSolve();
                    }
                    return;
                }

                const step = this.solveSteps.shift();
                const diskId = this.pegs[step.from].pop();

                this.startTimer();
                this.moveCount++;
                this.updateUI();

                const startPos = this.getDiskPosition(step.from, this.pegs[step.from].length);
                const endPos = this.getDiskPosition(step.to, this.pegs[step.to].length);

                this.isDragging = false;
                this.dragState = {
                    diskId: diskId,
                    sourcePeg: step.from,
                    targetPeg: step.to,
                    x: startPos.x,
                    y: startPos.y,
                    targetX: endPos.x,
                    targetY: endPos.y,
                    isSnapping: true
                };

                this.audio.playDrop(diskId);

                const speedVal = parseInt(document.getElementById('solve-speed').value);
                const delay = Math.max(80, 500 - (speedVal * 85));

                const checkSolveArrival = setInterval(() => {
                    if (!this.dragState) {
                        clearInterval(checkSolveArrival);
                        if (!this.isGameWon && this.isAutoSolving) {
                            this.solveTimeout = setTimeout(() => this.executeNextSolveStep(), delay);
                        } else {
                            this.stopAutoSolve();
                        }
                    }
                }, 30);
            }

            startLoop() {
                const render = () => {
                    this.updatePhysics();
                    this.draw();
                    requestAnimationFrame(render);
                };
                requestAnimationFrame(render);
            }

            updatePhysics() {
                if (this.dragState) {
                    if (this.isDragging) {
                        this.dragState.x += (this.dragState.targetX - this.dragState.x) * 0.4;
                        this.dragState.y += (this.dragState.targetY - this.dragState.y) * 0.4;
                    } else if (this.dragState.isSnapping) {
                        const dx = this.dragState.targetX - this.dragState.x;
                        const dy = this.dragState.targetY - this.dragState.y;
                        this.dragState.x += dx * 0.35;
                        this.dragState.y += dy * 0.35;

                        if (Math.hypot(dx, dy) < 1.0) {
                            this.finishSnapInstantly();
                        }
                    }
                }

                for (let i = this.particles.length - 1; i >= 0; i--) {
                    this.particles[i].update();
                    if (this.particles[i].life <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            }

            draw() {
                this.ctx.save();
                this.ctx.setTransform(1, 0, 0, 1, 0, 0);
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                this.ctx.restore();

                // 1. Draw Wooden Base Platform
                this.drawBase();

                // 2. Draw Metallic Pegs
                this.drawPegs();

                // 3. Draw Disks inside Peg Stacks
                this.drawStackedDisks();

                // 4. Draw Active Dragged / Snapping Disk on Top
                if (this.dragState) {
                    this.drawDisk(this.dragState.x, this.dragState.y, this.dragState.diskId, true);
                }

                // 5. Draw Victory Confetti
                this.particles.forEach(p => p.draw(this.ctx));
            }

            drawBase() {
                const ctx = this.ctx;
                const baseY = this.baseY;

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 20;
                ctx.shadowOffsetY = 10;

                const baseGrad = ctx.createLinearGradient(0, baseY, 0, baseY + 28);
                baseGrad.addColorStop(0, '#334155');
                baseGrad.addColorStop(0.5, '#1e293b');
                baseGrad.addColorStop(1, '#0f172a');

                ctx.fillStyle = baseGrad;
                this.fillRoundedRect(ctx, 30, baseY, this.width - 60, 28, 12);
                ctx.restore();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.lineWidth = 1.5;
                this.strokeRoundedRect(ctx, 30, baseY, this.width - 60, 28, 12);
            }

            drawPegs() {
                const ctx = this.ctx;
                const pegNames = ['Peg A', 'Peg B', 'Peg C'];

                this.pegCoords.forEach((x, idx) => {
                    const topY = this.baseY - this.pegHeight;

                    const pegGrad = ctx.createLinearGradient(x - this.pegWidth / 2, 0, x + this.pegWidth / 2, 0);
                    pegGrad.addColorStop(0, '#475569');
                    pegGrad.addColorStop(0.5, '#94a3b8');
                    pegGrad.addColorStop(1, '#334155');

                    ctx.fillStyle = pegGrad;
                    this.fillRoundedRect(ctx, x - this.pegWidth / 2, topY, this.pegWidth, this.pegHeight, 7);

                    ctx.font = '600 12px Inter, sans-serif';
                    ctx.fillStyle = '#64748b';
                    ctx.textAlign = 'center';
                    ctx.fillText(pegNames[idx], x, this.baseY + 46);
                });
            }

            drawStackedDisks() {
                this.pegs.forEach((stack, pegIdx) => {
                    stack.forEach((diskId, stackPos) => {
                        const pos = this.getDiskPosition(pegIdx, stackPos);
                        this.drawDisk(pos.x, pos.y, diskId, false);
                    });
                });
            }

            drawDisk(x, y, diskId, isDragging) {
                const ctx = this.ctx;
                const diskW = this.getDiskWidth(diskId);
                const color = DISK_COLORS[diskId - 1];

                ctx.save();

                if (isDragging) {
                    ctx.shadowColor = color.start;
                    ctx.shadowBlur = 18;
                    ctx.shadowOffsetY = 6;
                } else {
                    ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetY = 4;
                }

                const grad = ctx.createLinearGradient(x - diskW / 2, y, x + diskW / 2, y + this.diskHeight);
                grad.addColorStop(0, color.start);
                grad.addColorStop(1, color.end);

                ctx.fillStyle = grad;
                this.fillRoundedRect(ctx, x - diskW / 2, y, diskW, this.diskHeight, 10);

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                ctx.lineWidth = 1;
                this.strokeRoundedRect(ctx, x - diskW / 2, y, diskW, this.diskHeight, 10);

                ctx.shadowColor = 'transparent';
                ctx.font = '700 11px Inter, sans-serif';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(diskId, x, y + this.diskHeight / 2);

                ctx.restore();
            }

            fillRoundedRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, radius);
                ctx.fill();
            }

            strokeRoundedRect(ctx, x, y, width, height, radius) {
                ctx.beginPath();
                ctx.roundRect(x, y, width, height, radius);
                ctx.stroke();
            }
        }

        window.onload = () => {
            window.gameInstance = new HanoiGame();
        };
    </script>
</body>
